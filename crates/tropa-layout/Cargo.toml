[package]
name = "tropa-layout"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Layered graph layout for Tropa, a port of bench/sugi.ts (benchmark spike)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Off-the-shelf comparison: the rust-sugiyama crate behind the same interface.
crate-sugiyama = ["dep:rust-sugiyama"]

[dependencies]
wasm-bindgen = "=0.2.130"
rust-sugiyama = { version = "0.4.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
