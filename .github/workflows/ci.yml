name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The layout engine's WebAssembly is kept in git (assets/wasm) so the plugin builds without Rust.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      # Builds it twice from scratch and fails unless both builds and the copy in git are the same byte for byte.
      - run: npm run build:wasm -- --verify
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Layout time and drawing quality against the 0.1 layout (dagre). Informational: the table goes to
  # the job summary, and a failed quality check shows up without blocking the pull request.
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench
